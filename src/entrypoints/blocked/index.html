<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube Shorts blocked</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        color: #172554;
        background: #eff6ff;
      }

      main {
        width: min(520px, calc(100vw - 32px));
        display: grid;
        gap: 16px;
        text-align: center;
      }

      h1 {
        margin: 0;
        font-size: 28px;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: #1e3a8a;
      }

      a {
        justify-self: center;
        border-radius: 6px;
        padding: 10px 14px;
        color: #ffffff;
        background: #2563eb;
        font-weight: 700;
        text-decoration: none;
      }

      @media (prefers-color-scheme: dark) {
        body {
          color: #e0f2fe;
          background: #0f172a;
        }

        p {
          color: #bae6fd;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>YouTube Shorts временно заблокированы.</h1>
      <p id="cooldown-status">Проверяем оставшееся время...</p>
      <a id="ordinary-youtube-link" href="#">Открыть обычный YouTube</a>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
