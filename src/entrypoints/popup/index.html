<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube Shorts Limiter</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      body {
        width: 320px;
        margin: 0;
        color: #1f2937;
        background: #f8fafc;
      }

      main {
        display: grid;
        gap: 14px;
        padding: 16px;
      }

      h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0;
      }

      form,
      .status {
        display: grid;
        gap: 10px;
      }

      label {
        display: grid;
        gap: 5px;
        font-size: 13px;
        font-weight: 600;
      }

      input {
        box-sizing: border-box;
        width: 100%;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        padding: 8px 10px;
        font: inherit;
        background: #ffffff;
        color: #111827;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      button {
        border: 0;
        border-radius: 6px;
        padding: 9px 10px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button[type="submit"] {
        color: #ffffff;
        background: #2563eb;
      }

      button[type="button"] {
        color: #1f2937;
        background: #e2e8f0;
      }

      dl {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 6px 12px;
        margin: 0;
        font-size: 13px;
      }

      dt,
      dd {
        margin: 0;
      }

      dt {
        color: #475569;
      }

      dd {
        font-weight: 700;
      }

      .message {
        min-height: 18px;
        margin: 0;
        font-size: 13px;
        color: #475569;
      }

      .message[data-kind="error"] {
        color: #b91c1c;
      }

      .message[data-kind="success"] {
        color: #166534;
      }

      @media (prefers-color-scheme: dark) {
        body {
          color: #e5e7eb;
          background: #111827;
        }

        input {
          border-color: #374151;
          background: #0f172a;
          color: #f8fafc;
        }

        button[type="button"] {
          color: #e5e7eb;
          background: #374151;
        }

        dt,
        .message {
          color: #cbd5e1;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>YouTube Shorts Limiter</h1>

      <form id="settings-form">
        <label>
          Allowed minutes
          <input
            id="allowed-minutes"
            name="allowedMinutes"
            type="number"
            inputmode="decimal"
            required
          />
        </label>

        <label>
          Cooldown minutes
          <input
            id="cooldown-minutes"
            name="cooldownMinutes"
            type="number"
            inputmode="decimal"
            required
          />
        </label>

        <div class="actions">
          <button type="submit">Save</button>
          <button id="reset-usage" type="button">Reset</button>
        </div>
      </form>

      <section class="status" aria-live="polite">
        <dl>
          <dt>Used</dt>
          <dd id="used-minutes">-</dd>
          <dt>Remaining</dt>
          <dd id="remaining-minutes">-</dd>
          <dt>Cooldown</dt>
          <dd id="cooldown-status">-</dd>
        </dl>
        <p id="message" class="message"></p>
      </section>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
